name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - run: bash test/parse.test.sh

  cli:
    name: cli (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash test/cli.test.sh

  guard:
    name: refuses to run off macOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash test/cli.test.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x bin/jitter-trace lib/parse.sh test/parse.test.sh test/cli.test.sh
